[project]
name = "grafana-alert-agent"
version = "0.1.0"
description = "AI on-call agent: polls Grafana/VictoriaMetrics over VPN, alerts to Discord with screenshots + Claude root-cause analysis. Read-only."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "playwright>=1.44",
    "discord.py>=2.4",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-aws>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
]

[project.scripts]
gaa = "gaa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "e2e: end-to-end tests that need a real browser/VPN (excluded from the coverage gate)",
]

[tool.coverage.run]
source = ["gaa"]
branch = true
omit = [
    "*/__main__.py",
    "*/cli.py",
    "*/screenshot/browser.py",
    "*/screenshot/grafana_auth.py",
    "*/vpn/health.py",
    "*/discord_bot/bot.py",
    "*/agent/mcp.py",
    "*/agent/model.py",
    "*/agent/graph.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
